<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm Builder · 无构建引入</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body data-demo="cdn">
  <div id="app">
    <div class="page-simple">
      <h1>无构建产物依赖</h1>
      <p class="sub">这一页只引一个 script 标签，没有打包、没有 import map，面板照样能用——调参产物自带引擎。</p>
      <div class="cards">
        <div class="card"><h3>script</h3><p>window.SwarmBuilderTune 全局可用。</p></div>
        <div class="card"><h3>tune</h3><p>一次调用就把创造者模式放到页面上。</p></div>
        <div class="card"><h3>片段</h3><p>调完复制出来的就是能粘进源码的配置。</p></div>
      </div>
    </div>
  </div>

  <script src="/dist/swarm-builder.tune.iife.js"></script>
  <script>
    const app = document.querySelector('#app');
    const tuner = window.SwarmBuilderTune.tune({
      root: app,
      open: true,
      position: 'bottom-right',
      initial: { agentCount: 4, speed: 2, sound: true, tour: true },
    });
    window.__tuner = tuner;

    if (new URLSearchParams(location.search).has('auto')) tuner.apply();
  </script>
</body>
</html>
