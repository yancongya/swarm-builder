<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm Builder · 深色复杂 UI</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body data-demo="blender" data-swarm='{"agentCount":10,"speed":2,"maxItems":260,"sound":true,"tour":true}'>
  <div id="app">
    <div class="page-blender">
      <div class="menubar">
        <span>文件</span><span>编辑</span><span>渲染</span><span>窗口</span>
        <span>帮助</span><span>工具</span><span>布局</span>
      </div>

      <div class="shell">
        <aside class="panel left">
          <h4>大纲</h4>
          <div class="tree">
            <div class="group">场景集合</div>
            <div class="group">场景</div>
            <div>摄像机</div>
            <div>收集器</div>
            <div class="group">立方体</div>
            <div>网格</div>
            <div>材质</div>
            <div>着色器节点</div>
            <div class="group">灯光</div>
            <div>太阳</div>
            <div>区域</div>
            <div class="group">集合</div>
            <div>地面</div>
            <div>环境贴图</div>
          </div>
        </aside>

        <main class="viewport">
          <div class="hud">用户透视 · 实体 · 正交</div>
          <div class="cube"></div>
          <canvas class="gl-view" width="160" height="110"></canvas>
        </main>

        <aside class="panel right props">
          <h4>属性</h4>
          <div class="section">
            <div class="title">变换 · 位置</div>
            <div class="field"><label>X</label><span class="value">0.0</span></div>
            <div class="field"><label>Y</label><span class="value">0.0</span></div>
            <div class="field"><label>Z</label><span class="value">1.2</span></div>
          </div>
          <div class="section">
            <div class="title">旋转</div>
            <div class="field"><label>X</label><span class="value">0.0°</span></div>
            <div class="field"><label>Y</label><span class="value">32.5°</span></div>
            <div class="field"><label>Z</label><span class="value">0.0°</span></div>
          </div>
          <div class="section">
            <div class="title">缩放</div>
            <div class="slider"><div class="fill"></div></div>
            <div class="field"><label>统一</label><span class="value">1.000</span></div>
          </div>
          <div class="section">
            <div class="title">材质</div>
            <div class="field"><label>基础色</label><span class="value">#8a90a0</span></div>
            <div class="field"><label>金属度</label><span class="value">0.10</span></div>
            <div class="field"><label>粗糙度</label><span class="value">0.45</span></div>
            <div class="chips">
              <span class="chip">漫射</span><span class="chip">高光</span>
              <span class="chip">环境光遮蔽</span><span class="chip">法线</span>
            </div>
          </div>
          <div class="section">
            <div class="title">渲染</div>
            <div class="field"><label>引擎</label><span class="value">Cycles</span></div>
            <div class="field"><label>采样</label><span class="value">128</span></div>
            <div class="field"><label>分辨率</label><span class="value">1920×1080</span></div>
          </div>
        </aside>

        <div class="timeline">
          <div class="track">
            <div class="key" style="left:12%"></div>
            <div class="key" style="left:34%"></div>
            <div class="key" style="left:71%"></div>
          </div>
          <div class="track">
            <div class="key" style="left:22%"></div>
            <div class="key" style="left:58%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function paintGlView() {
      const c = document.querySelector('.gl-view');
      const g = c && c.getContext('2d');
      if (!g) return;
      g.fillStyle = '#2d3138';
      g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = '#5f6a7a';
      g.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        g.beginPath();
        g.moveTo(0, (c.height / 4) * i);
        g.lineTo(c.width, (c.height / 4) * i);
        g.stroke();
      }
      const grd = g.createLinearGradient(0, 0, c.width, c.height);
      grd.addColorStop(0, '#c9793c');
      grd.addColorStop(1, '#6d7a45');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(c.width * 0.5, c.height * 0.45, 34, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#e6e9ef';
      g.font = '11px sans-serif';
      g.fillText('viewport GL', 8, c.height - 8);
    })();
  </script>

  <script type="module" src="./creator.ts"></script>
</body>
</html>
