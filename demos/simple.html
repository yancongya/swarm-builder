<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm Builder · 简单页</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body data-demo="simple">
  <div id="app">
    <div class="page-simple">
      <h1>简单页基准</h1>
      <p class="sub">最小场景：几个块、一段说明、三张卡片。用来确认重建链路是否跑通。</p>

      <div class="cards">
        <div class="card">
          <h3>Snapshot</h3>
          <p>遍历 DOM，产出矩形与文本蓝图。</p>
        </div>
        <div class="card">
          <h3>Scheduler</h3>
          <p>按文档顺序分给多个光标队列。</p>
        </div>
        <div class="card">
          <h3>Overlay</h3>
          <p>独立层重建，结束后回到真实页面。</p>
        </div>
      </div>

      <ul class="list">
        <li>第一项：验证尺寸徽章与灰盒占位</li>
        <li>第二项：验证打字与光标跟随 <span class="tag">含行内标签</span></li>
        <li>第三项：验证 onComplete 回调</li>
      </ul>
    </div>
  </div>

  <script type="module" src="./creator.ts"></script>
</body>
</html>
