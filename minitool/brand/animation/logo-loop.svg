<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Swarm Builder 彩色光标集群循环标识">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffca65"/><stop offset=".5" stop-color="#ff9f28"/><stop offset="1" stop-color="#f27414"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#ffb12c"/><stop offset=".55" stop-color="#ff8518"/><stop offset="1" stop-color="#ed6012"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#eaff51"/><stop offset=".52" stop-color="#c4f31d"/><stop offset="1" stop-color="#97d908"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff9e8"/><stop offset=".62" stop-color="#fff0c8"/><stop offset="1" stop-color="#fbd88f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2=".15" y2="1">
      <stop stop-color="#fff4d9"/><stop offset="1" stop-color="#f6d692"/>
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2b1409" flood-opacity=".28"/>
    </filter>
    <path id="pointer" d="M6 7 13 126 42 99 70 143 Q75 151 84 146 L101 136 Q109 131 104 121 L78 79 113 75 Q128 72 119 59 Z" stroke="#080805" stroke-width="12" stroke-linejoin="round"/>
    <path id="shine" d="M27 35 34 90 53 76" fill="none" stroke="#fffbe9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  </defs>

  <g class="orbit-layer" transform="translate(256 256) scale(.86) translate(-256 -256)">
    <g class="orbit">
      <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="3s" repeatCount="indefinite"/>
      <circle cx="256" cy="256" r="183" fill="none" stroke="#090806" stroke-width="34"/>
      <circle cx="256" cy="256" r="183" fill="none" stroke="url(#ring)" stroke-width="24"/>
      <circle cx="256" cy="256" r="181" fill="none" stroke="#ffe39b" stroke-width="4" opacity=".55"/>
    </g>
    <g filter="url(#soft-shadow)">
      <g class="orbit-cursors">
        <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="3s" repeatCount="indefinite"/>
        <g transform="translate(159 15) rotate(-22 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="-15 60 70;20 60 70;-15 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#orange)"/><use href="#shine"/></g></g>
        <g transform="translate(324 45) rotate(38 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="16 60 70;-18 60 70;16 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#green)"/><use href="#shine"/></g></g>
        <g transform="translate(388 200) rotate(94 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="-18 60 70;14 60 70;-18 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#cream)"/><use href="#shine"/></g></g>
        <g transform="translate(274 356) rotate(159 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="14 60 70;-20 60 70;14 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#green)"/><use href="#shine"/></g></g>
        <g transform="translate(89 315) rotate(214 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="-16 60 70;18 60 70;-16 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#orange)"/><use href="#shine"/></g></g>
        <g transform="translate(10 139) rotate(278 60 70)"><g><animateTransform attributeName="transform" type="rotate" values="18 60 70;-14 60 70;18 60 70" keyTimes="0;.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/><use href="#pointer" fill="url(#cream)"/><use href="#shine"/></g></g>
      </g>
    </g>
  </g>

  <g class="center">
    <g transform="translate(256 256)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.03;1;1.03;1;1.03;1;1.03;1" keyTimes="0;.12;.25;.37;.5;.62;.75;.87;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="3s" repeatCount="indefinite"/>
        <g transform="translate(-256 -256)">
          <g filter="url(#soft-shadow)">
            <rect x="173" y="171" width="166" height="168" rx="39" fill="#080806"/>
            <rect x="181" y="179" width="150" height="151" rx="32" fill="url(#tile)"/>
            <path d="M198 216 Q200 194 227 193 H285 Q316 193 317 221 V236 H198Z" fill="#fff8e8" opacity=".57"/>
            <path d="M207 209 Q215 195 229 197" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".94"/>
            <g class="tiles">
              <g class="tile"><animateTransform attributeName="transform" type="translate" values="230.5 260;282.5 260;282.5 260;282.5 310;282.5 310;230.5 310;230.5 310;230.5 260;230.5 260" keyTimes="0;.12;.25;.37;.5;.62;.75;.87;1" calcMode="spline" keySplines="0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1" dur="3s" repeatCount="indefinite"/><rect x="-21.5" y="-21" width="43" height="42" rx="10" fill="#080806"/><rect x="-15.5" y="-15" width="31" height="30" rx="7" fill="url(#green)"/></g>
              <g class="tile"><animateTransform attributeName="transform" type="translate" values="282.5 260;282.5 310;282.5 310;230.5 310;230.5 310;230.5 260;230.5 260;282.5 260;282.5 260" keyTimes="0;.12;.25;.37;.5;.62;.75;.87;1" calcMode="spline" keySplines="0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1" dur="3s" repeatCount="indefinite"/><rect x="-21.5" y="-21" width="43" height="42" rx="10" fill="#080806"/><rect x="-15.5" y="-15" width="31" height="30" rx="7" fill="url(#orange)"/></g>
              <g class="tile"><animateTransform attributeName="transform" type="translate" values="230.5 310;230.5 260;230.5 260;282.5 260;282.5 260;282.5 310;282.5 310;230.5 310;230.5 310" keyTimes="0;.12;.25;.37;.5;.62;.75;.87;1" calcMode="spline" keySplines="0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1" dur="3s" repeatCount="indefinite"/><rect x="-21.5" y="-21" width="43" height="42" rx="10" fill="#080806"/><rect x="-15.5" y="-15" width="31" height="30" rx="7" fill="url(#orange)"/></g>
              <g class="tile"><animateTransform attributeName="transform" type="translate" values="282.5 310;230.5 310;230.5 310;230.5 260;230.5 260;282.5 260;282.5 260;282.5 310;282.5 310" keyTimes="0;.12;.25;.37;.5;.62;.75;.87;1" calcMode="spline" keySplines="0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1;0.3 0.7 0.2 1;0 0 1 1" dur="3s" repeatCount="indefinite"/><rect x="-21.5" y="-21" width="43" height="42" rx="10" fill="#080806"/><rect x="-15.5" y="-15" width="31" height="30" rx="7" fill="url(#green)"/></g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

</svg>
